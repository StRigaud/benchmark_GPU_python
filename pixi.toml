[workspace]
name = "benchmark"
version = "0.1.0"
description = "A minimalist Python library for benchmarking GPU operations comparing numpy, cupy, and pyclesperanto"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64"]

[system-requirements]
cuda = "12" 

[tasks]
test = "pytest tests/ -v"
benchmark = "pytest tests/test_benchmarks.py -v --benchmark-only --benchmark-json=benchmark_results.json"
benchmark-cuda = "pytest tests/test_benchmarks.py -v --benchmark-only -k 'numpy or cupy or pyclesperanto_cuda' --benchmark-json=benchmark_results_cuda.json"
benchmark-opencl = "pytest tests/test_benchmarks.py -v --benchmark-only -k 'pyclesperanto and not pyclesperanto_cuda and not pyclesperanto_metal' --benchmark-json=benchmark_results_opencl.json"
benchmark-metal = "pytest tests/test_benchmarks.py -v --benchmark-only -k 'numpy or pyclesperanto_metal' --benchmark-json=benchmark_results_metal.json"
boxplots = "python -m benchmark.boxplots"
charts = "python -m benchmark.charts"
install = "pip install -e ."

[dependencies]
python = ">=3.12,<3.14"
numpy = "*"
pytest = "*"
pytest-benchmark = "*"
matplotlib = "*"
pandas = "*"
pip = "*"
scipy = "*"

[target.win-64.pypi-dependencies]
cupy-cuda12x = ">=14.0.1, <15"
pyclesperanto_cuda = ">=0.25.0"

# Linux: cupy comes from conda-forge, built against CUDA 12.6 (matches pyclesperanto_cuda and the
# cuda-compat-12-6 libcuda used on the HPC). Provides nvrtc, cublas, cufft and the CUDA headers.
[target.linux-64.dependencies]
cuda-version = "12.6.*"
cupy = ">=14.0.1,<15"
cuda-cudart-dev = "*"
cuda-nvrtc-dev = "*"
cuda-cccl_linux-64 = "*"
libcublas-dev = "*"
libcufft-dev = "*"

[target.linux-64.pypi-dependencies]
pyclesperanto_cuda = ">=0.25.0"

[target.osx-64.pypi-dependencies]
pyclesperanto_metal = ">=0.25.0"

[pypi-dependencies]
pyclesperanto = ">=0.25.0"
pyclesperanto_opencl = ">=0.25.0"
seaborn = ">=0.13.2, <0.14"


